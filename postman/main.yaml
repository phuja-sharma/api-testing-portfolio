name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Testing Repository
        uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Create .env File
        working-directory: ./server
        run: |
          echo "PORT=3001" > .env
          echo "NODE_ENV=test" >> .env
          echo "MONGO_URI=mongodb://127.0.0.1:27017/warung-kasir" >> .env
          echo "JWT_SECRET=secretkey123" >> .env

      # Jalankan backend secara background dan SIMPAN LOGNYA DULU
      - name: Start Backend Server
        working-directory: ./server
        run: npm start > server.log 2>&1 &

      # Beri jeda 5 detik agar server sempat nulis log kalau ada error/crash
      - name: Wait 5 Seconds
        run: sleep 5

      # Step ini WAJIB JALAN TERLEBIH DAHULU sebelum wait-on biar kelihatan isi log-nya
      - name: Print Server Log Always
        run: cat server/server.log

      - name: Wait for Server Port
        run: npx wait-on http-get://127.0.0.1:3001 --timeout 30000
name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Testing Repository
        uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      # Buat .env dummy dengan host MongoDB ke 127.0.0.1
      - name: Create .env File
        working-directory: ./server
        run: |
          echo "PORT=3001" > .env
          echo "NODE_ENV=test" >> .env
          echo "MONGO_URI=mongodb://127.0.0.1:27017/warung-kasir" >> .env
          echo "JWT_SECRET=secretkey123" >> .env

      - name: Start Backend Server
        working-directory: ./server
        run: npm start > server.log 2>&1 &

      - name: Wait for Server Startup
        run: sleep 8

      - name: Check Log If Port Fails
        run: cat server/server.log

      - name: Wait for Server Port
        run: npx wait-on http-get://127.0.0.1:3001 --timeout 30000

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection with Newman
        run: |
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"
name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install All Backend Dependencies
        working-directory: ./server
        run: |
          npm install
          npm install -D vitest supertest express cors helmet express-rate-limit better-sqlite3 @types/express @types/cors @types/node ts-node typescript

      - name: Create .env File
        working-directory: ./server
        run: |
          echo "PORT=3000" > .env
          echo "NODE_ENV=test" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Start Express Server Directly
        working-directory: ./server
        run: npx ts-node src/app.ts > server.log 2>&1 &

      - name: Wait for Server Port
        run: npx wait-on http-get://127.0.0.1:3000 --timeout 30000

      - name: Print Server Log on Failure
        if: failure()
        run: cat server/server.log

      - name: Install & Run Newman Tests
        run: |
          npm install -g newman
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"

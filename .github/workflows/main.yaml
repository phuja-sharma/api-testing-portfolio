name: API Automated Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Newman Tests
        run: |
          npm install -g newman
          newman run "postman/Test Warung-Kasir.postman_collection.json" \
            -e "postman/New Environment.postman_environment.json" \
            --env-var "baseUrl=https://warung-kasir-production.up.railway.app/api"

name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Jalankan MongoDB Service di runner GitHub
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      # 2. Checkout file testing milik kamu
      - name: Checkout Testing Repository
        uses: actions/checkout@v4

      # 3. Checkout source code backend abiiemmm/warung-kasir ke folder 'server'
      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- STEP BACKEND SERVER ---
      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      # Inject environment variables yang dibutuhkan warung-kasir
      - name: Create .env File
        working-directory: ./server
        run: |
          echo "PORT=3001" > .env
          echo "NODE_ENV=test" >> .env
          echo "MONGO_URI=mongodb://127.0.0.1:27017/warung-kasir" >> .env
          echo "DATABASE_URL=mongodb://127.0.0.1:27017/warung-kasir" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Start Backend Server
        working-directory: ./server
        run: npm start > server.log 2>&1 &

      - name: Wait for Server Startup
        run: sleep 5

      # Memaksa cetak log jika wait-on gagal
      - name: Wait for Server Port
        run: npx wait-on http-get://127.0.0.1:3001 --timeout 30000

      - name: Print Server Log on Failure
        if: failure()
        run: cat server/server.log

      # --- STEP TEST NEWMAN ---
      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection with Newman
        run: |
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"
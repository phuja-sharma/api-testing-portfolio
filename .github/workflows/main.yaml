name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Ammbi/Clone source code backend dari repositori pemilik asli ke folder 'server'
      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      # 2. Ambil file tes dari repositori kamu sendiri
      - name: Checkout Testing Repository
        uses: actions/checkout@v4
        with:
          path: .

      # --- STEP BACKEND SERVER ---
      - name: Install Backend Dependencies
        working-directory: ./server   # <--- GitHub Actions akan masuk ke folder server dulu
        run: npm install

      - name: Start Backend Server
        working-directory: ./server   # <--- Pindah ke folder server dulu
        run: npm start &

      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:3001 # Ganti port sesuai aplikasi kamu

      # --- STEP TEST NEWMAN ---
      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection with Newman
        run: |
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"
name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install All Backend Dependencies & Types
        working-directory: ./server
        run: |
          npm install
          npm install -D tsx typescript @types/node @types/express @types/cors @types/better-sqlite3 @types/supertest

      - name: Setup Environment File
        working-directory: ./server
        run: |
          echo "PORT=3000" > .env
          echo "NODE_ENV=test" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Start Backend Server
        working-directory: ./server
        run: npx tsx src/app.ts > server.log 2>&1 &

      - name: Wait for Server Port 3000
        run: npx wait-on http-get://127.0.0.1:3000 --timeout 15000 || true

      - name: Print Server Log Always
        if: always()
        run: cat server/server.log

      - name: Install & Run Newman
        run: |
          npm install -g newman
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"

name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir

      - name: Check Postman Directory Files
        run: ls -la postman/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Setup Env & Data Directory
        working-directory: ./server
        run: |
          mkdir -p data
          chmod -R 777 data
          echo "PORT=3001" > .env
          echo "NODE_ENV=test" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Start Express Server
        working-directory: ./server
        run: npx tsx src/index.ts > ../server.log 2>&1 &

      - name: Wait for Server Readiness
        run: sleep 5

name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install All Backend Dependencies
        working-directory: ./server
        run: |
          npm install
          npm install -D tsx typescript @types/node @types/express @types/cors @types/better-sqlite3 express-rate-limit helmet cors better-sqlite3

      - name: Create Data Directory & Setup Env
        working-directory: ./server
        run: |
          mkdir -p data
          echo "PORT=3001" > .env
          echo "NODE_ENV=test" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Run Database Migrations / Seed
        working-directory: ./server
        run: |
          npx tsx src/migrations.ts || npx tsx src/db.ts || true

      - name: Start Express Backend Directly
        working-directory: ./server
        run: npx tsx src/app.ts > server.log 2>&1 &

      - name: Wait for TCP Port 3001
        run: npx wait-on tcp:127.0.0.1:3001 --timeout 15000

      - name: Run Newman Tests
        run: |
          npm install -g newman
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"

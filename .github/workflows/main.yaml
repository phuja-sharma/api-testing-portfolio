name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil file tes dari repositori kamu sendiri dulu ke root
      - name: Checkout Testing Repository
        uses: actions/checkout@v4

      # 2. Ambil source code backend ke subfolder 'server'
      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- STEP BACKEND SERVER ---
      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Start Backend Server
        working-directory: ./server
        run: npm start &

      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:3001 --timeout 30000

      # --- STEP TEST NEWMAN ---
      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection with Newman
        run: |
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"
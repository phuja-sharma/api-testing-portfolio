name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Backend Dependencies
        working-directory: ./server
        run: |
          npm install
          npm install -D tsx typescript @types/node @types/express @types/cors @types/better-sqlite3

      - name: Create Data Directory & Setup Env
        working-directory: ./server
        run: |
          mkdir -p data
          echo "PORT=3001" > .env
          echo "NODE_ENV=test" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Run Package Start Script
        working-directory: ./server
        run: npm start

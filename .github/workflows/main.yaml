name: API Functional Tests (Newman)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: abiiemmm/warung-kasir
          path: server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: ./server
        run: npm install

      - name: Create .env
        working-directory: ./server
        run: |
          echo "PORT=3000" > .env
          echo "NODE_ENV=test" >> .env
          echo "MONGO_URI=mongodb://127.0.0.1:27017/warung-kasir" >> .env
          echo "DATABASE_URL=mongodb://127.0.0.1:27017/warung-kasir" >> .env
          echo "JWT_SECRET=supersecretkeyforportfolio123" >> .env

      - name: Build App (Skip TS Check)
        working-directory: ./server
        run: |
          node -e "const fs=require(\"fs\"); const p=\"next.config.ts\"; if(fs.existsSync(p)){ let c=fs.readFileSync(p,\"utf8\"); if(!c.includes(\"ignoreBuildErrors\")){ c=c.replace(/nextConfig\s*=\s*\{/, \"nextConfig = { typescript: { ignoreBuildErrors: true }, eslint: { ignoreDuringBuilds: true },\"); fs.writeFileSync(p, c); } }"
          npm run build

      - name: Start Server
        working-directory: ./server
        run: npm start > server.log 2>&1 &

      - name: Wait for Server
        run: npx wait-on http-get://127.0.0.1:3000 --timeout 30000

      - name: Run Newman
        run: |
          npm install -g newman
          newman run "postman/Test Warung-Kasir.postman_collection.json" -e "postman/New Environment.postman_environment.json"
